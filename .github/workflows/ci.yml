name: CI

# Runs the unit suite and the data-tracking guard on every push to `main` and every pull request.
#
# Both are fast and neither needs a credential, so this workflow stays a plain read-only check — the
# repository's other workflow, `data-sync-pipeline.yml`, is the one that holds tokens and publishes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      # Read-only by construction: this job builds nothing, publishes nothing and touches no credential.
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Matches `data-sync-pipeline.yml`. This repository declares no `engines`, so the pipeline's pin
      # is the best available evidence of what these services run under, and CI disagreeing with the
      # runtime that actually executes them would make a green here mean less than it looks.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No `playwright install`. The unit config declares no `webServer` and launches no browser —
      # these are pure-Node specs driven by the Playwright runner, so downloading Chromium would cost
      # a minute per run to exercise nothing.
      - name: Install dependencies
        run: npm ci

      # Runs before the suite because it is the cheaper assertion: the derived working set is
      # delivered rather than versioned, and this confirms none of it has become tracked.
      - name: Assert no derived data is tracked
        run: npm run check-data-tracking

      # `--project=unit` excludes `unit-profiling`, and both halves are deliberate.
      #
      # The two profiling specs read the real `users.jsonl`, which is gitignored and whose
      # `postinstall` fetch skips when CI is set, so they would need a ~10 MB download per run. They
      # also assert wall-clock budgets, and the unit config records that a shared, contended CPU can
      # double the store-filter measurement — which would surface as a product regression that does
      # not exist. They are machine-local profiling tools rather than correctness tests.
      #
      # `--fail-on-flaky-tests` matters because the config sets `retries: 2` under CI, and a Playwright
      # retry runs in a FRESH worker. Any state leaked between specs is therefore repaired by the retry
      # itself, and the run would report flaky-but-passed — green, for a suite that is not isolated.
      # This flag is what keeps that visible.
      #
      # Expect 47 tests. A project name matching nothing exits 0 with "0 passed", so a sudden drop in
      # that number indicates a selector problem rather than a smaller suite.
      - name: Unit tests
        run: npx playwright test -c test/playwright/playwright.config.unit.mjs --project=unit --fail-on-flaky-tests

      # `if: failure()` rather than `always()`: on a green run nobody opens it, and the report's traces
      # only carry information once something has gone wrong.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/playwright/test-results/unit/
          retention-days: 7
