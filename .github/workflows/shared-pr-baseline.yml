# DevIndex owns only the event trigger, its permissions, the team roster input and the Skills release
# it calls. The called workflow owns every job, so their implementation cannot drift in this consumer.

name: Shared PR Baseline

# The called PR-body job reads the pull request itself; a caller granting less fails at startup.
permissions:
  contents: read
  pull-requests: read

# Deliberately unfiltered: once these jobs become required contexts, every PR must emit a terminal
# result. The called PR-base job rejects an unsupported base instead of leaving a context pending.
# `edited` re-runs the PR-body job on a body-only fix; GitHub's default types omit it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  baseline:
    name: Shared PR Baseline
    # A published release tag, never a commit SHA; dependabot moves it on each release.
    uses: neomjs/neo-agent-skills/.github/workflows/reusable-pr-baseline.yml@v0.1.17
    # The team roster tells the commit-authorship job whose commits are an agent's; without it the job
    # checks nothing. It is read from the Brain's `dev`, never from the pull request under review.
    with:
      team_roster_repository: neomjs/neo-agent-brain
      team_roster_path: ai/graph/agentCoAuthorEmails.mjs
