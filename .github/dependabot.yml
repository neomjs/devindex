# Version updates. Security updates are a separate surface that needs no config and already runs.
#
# MAJORS ARE INCLUDED BY NOT BEING EXCLUDED: Dependabot's default spans every SemVer level, and you
# opt out with `ignore: [{update-types: ["version-update:semver-major"]}]`. The absence of that key
# is deliberate — do not add one without changing the policy it encodes.
#
# GROUPED, because ungrouped daily updates open a PR per dependency and the queue stops being read.
# `github-actions` is here because nothing else updates the pinned action versions.
#
# `neo.mjs` needs no carve-out here: it is a registry range, unlike the Brain's tarball URL and the
# Institution's `github:` refs, so Dependabot can actually track it.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    groups:
      all-deps:
        patterns: ["*"]
        # Both exclusions are here for the same reason: their diff has to be read, and a standalone
        # PR is the only place that happens. Inside the bulk bump it gets skimmed.
        #
        # monaco-editor: a version bump requires addon/wrapper compatibility checks.
        # neo-agent-skills: `postinstall` runs `neo-agent-skills-materialize`, so a release rewrites
        # the workflows every agent in this checkout obeys. Which rules an agent reads is a reviewed
        # fact or it is an accident.
        exclude-patterns: ["monaco-editor", "neo-agent-skills"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]
